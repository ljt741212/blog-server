services:
  app:
    build: .
    container_name: blog-server
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    volumes:
      - ./logs:/app/logs

  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-blog_db}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
