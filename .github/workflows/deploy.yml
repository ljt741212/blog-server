name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy
        run: |
          set -e

          echo ">>> building image..."
          docker build -t blog-server:latest .

          cd /opt/blog-server

          echo ">>> restarting services..."
          docker compose up -d --remove-orphans

          echo ">>> waiting for app to be ready..."
          sleep 15

          echo ">>> running migrations..."
          docker compose exec -T app node node_modules/typeorm/cli.js migration:run -d dist/config/data-source.js

          echo ">>> seeding admin..."
          docker compose exec -T app node dist/scripts/seed-admin.js || echo "  seed skipped (already seeded or error)"

          echo ">>> cleaning up old images..."
          docker image prune -f

          echo ">>> container status:"
          docker compose ps

          echo ">>> recent logs:"
          docker compose logs --tail 30
