name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

env:
  REGISTRY: crpi-if0dbq06utqk8du0.cn-hongkong.personal.cr.aliyuncs.com
  NAMESPACE: blog-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Build and push blog-server
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/server:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/server:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/server:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/server:latest
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/server:latest

      - name: Sync mysql:8.0 to ACR
        run: |
          docker pull mysql:8.0
          docker tag mysql:8.0 ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mysql:8.0
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/mysql:8.0

      - name: Sync redis:7-alpine to ACR
        run: |
          docker pull redis:7-alpine
          docker tag redis:7-alpine ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/redis:7-alpine
          docker push ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/redis:7-alpine

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

            cd /opt/blog-server

            cat > docker-compose.yml << 'COMPOSE_EOF'
            services:
              mysql:
                image: crpi-if0dbq06utqk8du0.cn-hongkong.personal.cr.aliyuncs.com/blog-server/mysql:8.0
                container_name: blog-mysql
                restart: always
                environment:
                  MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
                  MYSQL_DATABASE: ${DB_DATABASE:-blog_db}
                volumes:
                  - mysql_data:/var/lib/mysql
                healthcheck:
                  test:
                    [
                      "CMD",
                      "mysqladmin",
                      "ping",
                      "-h",
                      "localhost",
                      "-u",
                      "root",
                      "-p${DB_PASSWORD}",
                    ]
                  interval: 10s
                  timeout: 5s
                  retries: 10
                  start_period: 30s
                networks:
                  - blog_network

              redis:
                image: crpi-if0dbq06utqk8du0.cn-hongkong.personal.cr.aliyuncs.com/blog-server/redis:7-alpine
                container_name: blog-redis
                restart: always
                volumes:
                  - redis_data:/data
                networks:
                  - blog_network
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              app:
                image: SERVER_IMAGE
                container_name: blog-server
                restart: always
                ports:
                  - "3004:3004"
                environment:
                  DB_HOST: mysql
                  DB_PORT: ${DB_PORT:-3306}
                  DB_USERNAME: ${DB_USERNAME:-root}
                  DB_PASSWORD: ${DB_PASSWORD}
                  DB_DATABASE: ${DB_DATABASE:-blog_db}
                  DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
                  DB_LOGGING: ${DB_LOGGING:-error}
                  JWT_SECRET: ${JWT_SECRET}
                  PORT: ${PORT:-3004}
                  NODE_ENV: ${NODE_ENV:-production}
                  CORS_ORIGIN: ${CORS_ORIGIN}
                  EMAIL_HOST: ${EMAIL_HOST}
                  EMAIL_PORT: ${EMAIL_PORT:-465}
                  EMAIL_SECURE: ${EMAIL_SECURE:-true}
                  EMAIL_USER: ${EMAIL_USER}
                  EMAIL_PASS: ${EMAIL_PASS}
                  EMAIL_FROM: ${EMAIL_FROM}
                  OSS_REGION: ${OSS_REGION}
                  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
                  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
                  OSS_BUCKET: ${OSS_BUCKET}
                  SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
                  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
                  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
                  REDIS_HOST: redis
                  REDIS_PORT: 6379
                depends_on:
                  mysql:
                    condition: service_healthy
                  redis:
                    condition: service_healthy
                networks:
                  - blog_network

            volumes:
              mysql_data:
              redis_data:

            networks:
              blog_network:
            COMPOSE_EOF

            sed -i "s|SERVER_IMAGE|${{ env.REGISTRY }}/${{ env.NAMESPACE }}/server:${{ github.sha }}|" docker-compose.yml

            docker compose pull
            docker compose up -d --remove-orphans
            sleep 15
            docker compose exec -T app node node_modules/typeorm/cli.js migration:run -d dist/config/data-source.js
            docker compose exec -T app node dist/scripts/seed-admin.js || echo "seed skipped"
            docker image prune -f
            docker compose ps
            docker compose logs --tail 30
